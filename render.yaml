databases:
  - name: breathe-esg-db
    plan: free
    databaseName: breathe_esg
    user: breathe_esg_user

services:
  - type: web
    name: breathe-esg
    env: python
    region: oregon
    plan: free
    # Root directory of the repo (where the backend lives)
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi --workers 2 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://breathe-esg.onrender.com"
